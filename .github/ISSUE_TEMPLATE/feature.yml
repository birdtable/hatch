name: Feature request
description: Ask for something hatch does not do yet.
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What you are trying to do
      description: The task in your program, not only the API you want.
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: The API you have in mind
      description: Optional.
    validations:
      required: false
